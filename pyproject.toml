[project]
name = "docintel-mcp"
version = "0.1.0"
description = "AI document intelligence for insurance documents, exposed to agents as an MCP server"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
docintel-mcp = "docintel.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
# Personal local notes and component prototypes, gitignored. Not held to project lint rules.
extend-exclude = ["learning"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare assert; S101 only matters where `python -O` could strip a check.
"tests/**" = ["S101"]
